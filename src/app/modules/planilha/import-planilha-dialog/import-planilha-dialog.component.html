<div class="div-barra">
  <mat-toolbar>
    <span class="example-spacer"
      >Rotina Para Importar Planilha De Participantes</span
    >
    <div class="button-container">
      <button mat-raised-button color="#FFFFFF" (click)="onUpload()"  [disabled]="this.formulario.valid == false || status > 0  ">
        <mat-icon>check</mat-icon>
        Upload
      </button>
      <button mat-raised-button color="accent" (click)="closeModal()">
        <mat-icon>cancel</mat-icon>
        {{ this.status == 3 ? 'Fechar' : 'Cancelar' }}
      </button>
    </div>
  </mat-toolbar>
</div>
<mat-dialog-content class="dialog-content">
  <form [formGroup]="formulario" autocomplete="off" class="form-container" *ngIf="status == 0" >
    <div class="col-med-2">
      <mat-form-field appearance="outline" class="col-max">
        <mat-label>Evento</mat-label>
        <mat-select formControlName="id_evento">
          <mat-option *ngFor="let evento of lsEventos" [value]="evento.id">
            {{ evento.descricao }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="NoValidtouchedOrDirty('id_evento')"
          >{{ getMensafield("id_evento") }}
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col-max">
        <mat-label>Arquivo</mat-label>
        <input matInput formControlName="caminho" />
        <button
          mat-icon-button
          matSuffix
          matTooltip="Limpar seleção"
          (click)="fileInput.click(); $event.stopPropagation()"
          class="clear-buttoncd abs"
        >
          <mat-icon>search</mat-icon>
        </button>
        <mat-error *ngIf="NoValidtouchedOrDirty('caminho')"
          >{{ getMensafield("caminho") }}
        </mat-error>
      </mat-form-field>
    </div>
    <input
      #fileInput
      type="file"
      hidden
      (change)="onFileSelected($event)"
      accept=".csv"
    />
  </form>

  <div class="loading-container" *ngIf="status == 1 || status == 2">
    <h3>Upload Da Planilha</h3>
    <mat-progress-bar
          mode=determinate
          [value]="progress"
          bufferValue=100>
    </mat-progress-bar>
    <h3>{{ getMessageProgress() }}</h3>
  </div>
  <div class="resumo" *ngIf="status == 3">
    <h3>Total De Linhas.....: {{ total_linhas }}</h3>
    <h3>Total De Linhas Erro: {{ total_linhas_erro }}</h3>
  </div>
</mat-dialog-content>
