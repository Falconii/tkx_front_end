<div class="toolbar-alinhada">
  <mat-toolbar color="blue">
    <span class="example-spacer">Dashboard</span>
    <button
      mat-icon-button
      class="example-icon"
      aria-label="Example icon-button with share icon"
      (click)="atualizar()"
      matTooltip="Atualizar"
      matTooltipPosition="above"
    >
      <mat-icon>rotate_right</mat-icon>
    </button>
  </mat-toolbar>
</div>
<form [formGroup]="formulario" autocomplete="off">
  <div class="col-md-1">
    <mat-form-field appearance="outline" class="col-max">
      <mat-label>Evento</mat-label>
      <mat-select formControlName="id_evento" (selectionChange)="onChangeParametros()">
        <mat-option *ngFor="let evento of lsEventos" [value]="evento.id">
          {{ evento.descricao }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</form>
<div class="container" *ngIf="eventoPrincipal > 0">
   <div [ngClass]="isMobile ? 'col-med-1' : 'col-med-2'">
     <div class="col-max box">
        <div id="chart_categorias" ></div>
     </div>
     <div class="col-max box" *ngIf="lsCategorias.length > 0">
        <h3 class="alinha_centro">RESUMO CATEGORIAS</h3>
        <table class="Browse_Lanc">
          <tr class="coluna-cabec">
            <th>Categoria</th>
            <th>TOTAL</th>
          </tr>
          <tr *ngFor="let categoria of lsCategorias">
            <td>
              <div class="alinha_esquerda">
                <mat-label class="Browse_Lanc_td">{{ categoria.categoria_descricao }} </mat-label>
              </div>
            </td>
            <td>
              <div class="alinha_direita">
                <mat-label class="Browse_Lanc_td_rigth"
                  >{{ categoria.total | number: "1.0-0" }}
                </mat-label>
              </div>
            </td>
          </tr>
        </table>
      </div>
   </div>
   <div [ngClass]="isMobile ? 'col-med-1' : 'col-med-2'">
      <div class = "col-max box">
        <div id="chart_operadores"></div>
      </div>
    <div class="col-max box" *ngIf="lsOperadores.length > 0">
        <h3 class="alinha_centro">RESUMO OPERADORES</h3>
        <table class="Browse_Lanc">
          <tr class="coluna-cabec">
            <th>Operador</th>
            <th>TOTAL</th>
          </tr>
          <tr *ngFor="let operador of lsOperadores">
            <td>
              <div class="alinha_esquerda">
                <mat-label class="Browse_Lanc_td">{{ operador.razao }} </mat-label>
              </div>
            </td>
            <td>
              <div class="alinha_direita">
                <mat-label class="Browse_Lanc_td_rigth"
                  >{{ operador.total | number: "1.0-0" }}
                </mat-label>
              </div>
            </td>
          </tr>
        </table>
    </div>
   </div>
</div>
